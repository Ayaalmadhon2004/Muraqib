name: Muraqib Audit

on:
  push:
    branches: [ main, master, 'work/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build --if-present
      - name: Run Muraqib audit runner
        run: npx tsx src/index.ts --silent || true
      - name: Upload audit report (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muraqib-audit-log
          path: |
            ./audit.log
            ./**/muraqib-report-*.json
